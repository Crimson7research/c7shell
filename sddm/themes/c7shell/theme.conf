[General]
# Wallpaper behind the login card. Empty means the generated backdrop -- near
# black, two crimson glows, a 56px grid -- which is what the design specifies
# and needs no readable file.
#
# For "boot -> desktop is one continuous image", point this at the same file
# hyprpaper uses. It must be readable by the sddm user, so somewhere under
# /usr/share, not in a home directory: the greeter runs before any session and
# home directories are usually 700.
background=

# Draw the 56px grid over the backdrop. Ignored when a wallpaper is set.
grid=true

# Show the user list beside the card:
#   auto    when the machine has more than one account (default)
#   always  even for a single account
#   never   never; "switch user" on the card still opens it
userList=auto

# Offer an "other..." row for an account sddm does not list (hidden, or from a
# remote directory).
#
# On by default, because on a machine joined to a directory it is the only way
# in for someone who has not signed in here before. sddm builds its list from
# NSS, and a directory backend can only enumerate the accounts it has cached --
# which are the ones that have already authenticated on this machine. A new
# user is in the directory but not in that cache, so nothing lists them and
# there is no row to select. They have to type the name once; after that they
# enumerate like anyone else.
allowManualLogin=true

# Draw the login card on every screen instead of the primary one only. The
# other screens keep showing just the backdrop by default, which is the design.
# With this on, each screen gets its own card, its own user selection and its
# own cooldown -- sddm hands the keyboard to one window, so you type into the
# focused card and the others stay decorative until you click one.
loginOnAllScreens=false

# Failures before the 30-second cooldown, and its length. The greeter's own
# limit -- pam_faillock's is separate and stricter.
maxAttempts=3
cooldownSeconds=30
