#
# ---- HYPRLOCK ----
#
# The lock screen from the design doc (turn 11): the blurred desktop, an
# oversized thin clock in the bottom-left corner, and a password field that is
# not there until you touch a key. Deliberately thinner than the login greeter --
# the session is still the user's, so there is no avatar, no user list and no
# session picker.
#
# Sizes are the mockup's 1120x630 units multiplied by 1.2, which is what
# sddm/themes/c7shell/Theme.qml resolves to on a 1080p panel (fit * 0.7, clamped
# to 1.6). The greeter recomputes that per screen; hyprlock has no scale hook and
# no arithmetic in hyprlang, so the numbers are baked at the 1080p rendering and
# a much larger panel gets a proportionally smaller lock screen. That is the
# trade for the two screens sharing one set of design tokens.
#
# The accent glow and the 56px grid are not in this file. hyprlock has no
# gradients and no tiling, but it does have an image widget -- so c7shell-lock
# renders both to a PNG sized to the monitor and appends an `image` block per
# screen to a generated copy of this config. It has to happen at lock time:
# image:size is a single int with the aspect ratio preserved, so a PNG that is
# not the screen's own size rescales the grid into a different cell size on
# every machine. Running hyprlock directly skips the decoration and nothing
# else.
#
# One thing in the mockup genuinely has no equivalent: the "locked · press any
# key" hint is drawn in the resting state only, and hyprlock has no conditional
# visibility, so it stays up while you type.
#
# This file existing is not cosmetic. hyprlock does NOT fall back to
# /usr/share/hypr/hyprlock.conf -- with no config it exits at startup with
# "Could not find config", which silently turns super+l, the power dropdown's
# lock row and hypridle's lock_cmd into no-ops.

# Mono throughout, per the mockup. The clock is weight 200, which fontconfig
# only reaches by style name -- there is no font_weight key.
$mono     = JetBrains Mono
$monoThin = JetBrains Mono ExtraLight

# The palette, and the accent in it is appearance.json's. hyprlang does no
# variable expansion and cannot read JSON, so hyprlock cannot follow the
# settings app on its own -- what it can do is source a file, and
# scripts/c7shell-theme-export.py writes these same nine variables to
# hyprlock-palette.conf from the accent and variant the shell is using. The
# exporter runs on every accent, theme and colour-scheme change, and once from
# c7shell-setup, so the file is there on any machine that has been set up.
#
# The block below is what a machine that has never exported falls back to, not
# dead weight: hyprlang expands a variable where it is USED and takes the last
# definition before that point, so the source line overrides every value here,
# and a missing palette file is one ERR in the log rather than a lock screen
# with no colours in it. Keep the two in step -- a name here that the exporter
# does not write silently keeps its crimson default.
$ink      = rgba(f0eff1e6)   # .90 -- clock
$ink2     = rgba(f0eff14d)   # .30 -- the line under the field
$ink3     = rgba(f0eff157)   # .34 -- date
$ink4     = rgba(f0eff142)   # .26 -- lock hint, media, status
$glass    = rgba(0f0f13b3)   # panel, .70
$focus    = rgba(e53a448c)   # accent .55, the field's focus ring
$accent   = rgba(e53a44ff)
$capslock = rgba(e5717899)   # accentSoft .60 -- caps lock on
$success  = rgba(4ade80ff)

source = $HOME/.config/hypr/hyprlock-palette.conf

general {
    hide_cursor = true
    # Take the screen copy through wl_shm instead of dmabuf.
    #
    # hyprlock needs a copy of the screen for two things: the `path = screenshot`
    # background below, and the fade in and out, which are on by default. Its
    # default route for that is a GBM buffer imported over zwp_linux_dmabuf_v1 --
    # and on a virtual GPU that route does not exist. aquamarine cannot build a
    # DRM renderer there ("Can't create renderer, no matching devices found"), so
    # the compositor rejects the buffer, kills the connection, and hyprlock
    # aborts on the hangup before it has drawn anything:
    #
    #     eglQueryDmaBufModifiersEXT failed, falling back to regular bo
    #     wl_display#1: error 1: invalid arguments for zwlr_screencopy_frame_v1.copy
    #     ASSERTION FAILED! [core] Disconnected from pollfd id 0
    #
    # What that looks like from the desk is SUPER+L doing nothing, the power
    # menu's lock row doing nothing, and -- the part nobody sees -- hypridle's
    # before_sleep_cmd failing the same way, so the machine suspends unlocked.
    #
    # Mode 1 is the shm path: hyprlock mmaps a pool, has the compositor blit into
    # it and converts on the CPU, and never binds zwp_linux_dmabuf_v1 at all. It
    # is the same route grim takes, which is why screenshots work on machines
    # where the lock screen does not.
    #
    # Set unconditionally rather than only on a virtual GPU, because hyprlang has
    # no conditionals and the cost is one full-screen CPU copy at the moment you
    # lock. That is worth paying everywhere to have the lock screen work
    # everywhere.
    screencopy_mode = 1
    # No grace period is configured because v0.9.6 has no general:grace -- it is
    # the --grace flag only, and its default of 0 is what is wanted anyway.
    # A bare Enter is a stray keypress, not a failed attempt worth counting.
    ignore_empty_input = true
}

# Fingerprint unlock is not in this file. c7shell-lock appends the auth block
# (and the line under the field that says what the reader wants) to its
# generated copy only while fprintd-list shows an enrolled finger -- switched
# on with none, every lock opens with a prompt for a reader that will never
# answer. Enroll fingers in settings -> fingerprints.

animations {
    enabled = true
    bezier = c7, 0.2, 0, 0, 1
    animation = fadeIn, 1, 4, c7
    animation = fadeOut, 1, 4, c7
    # The field's own reveal, which is what the mockup's 140ms fade is. Kept
    # separate from fadeIn so the two can be tuned apart.
    animation = inputFieldFade, 1, 2, c7
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # The desktop itself, blurred past legibility and dimmed. A screenshot has
    # nothing to keep in sync -- a hardcoded path would go stale the first time
    # the wallpaper is changed from the settings app.
    path = screenshot
    # The mockup asks for blur 40 at 55% dim. Four passes at size 8 is the
    # cheapest way to that radius; brightness is the dim, not a separate layer.
    blur_passes = 4
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.15
}

# TIME -- bottom-left, and the one element that carries the whole layout.
label {
    monitor =
    zindex = 1
    text = $TIME
    font_family = $monoThin
    font_size = 130
    color = $ink

    position = 67, 101
    halign = left
    valign = bottom
}

# DATE -- directly under the clock, indented by the mockup's 4px to sit flush
# with the clock's left sidebearing rather than its box.
label {
    monitor =
    zindex = 1
    text = cmd[update:60000] date +"%A %-d %B" | tr 'A-Z' 'a-z'
    font_family = $mono
    font_size = 16
    color = $ink3

    position = 72, 77
    halign = left
    valign = bottom
}

# The resting-state hint. hyprlock cannot hide it once the field is up, so it
# has to read true in both states -- "press any key" stays honest while typing.
label {
    monitor =
    zindex = 1
    text = locked · press any key
    font_family = $mono
    font_size = 13
    color = $ink4

    position = 72, 41
    halign = left
    valign = bottom
}

# NOW PLAYING -- the mockup's media card (design 15b), without the card.
# hyprlock's shape widget cannot be hidden, so a glass panel here would sit
# empty on every lock with nothing playing, which is most of them. A label with
# no output draws nothing at all, so the text stays and the panel goes.
#
# Two labels, because the card is two lines at two sizes and one label cannot
# be: the title, and the state and player under it. Both go dark together when
# there is nothing playing -- they read the same player through the same
# helper. Play/pause is XF86AudioPlay, which conf/binds.lua binds with
# locked = true; there is nothing on this screen to click.
label {
    monitor =
    zindex = 1
    text = cmd[update:2000] c7shell-lock-info media
    font_family = $mono
    font_size = 13
    color = $ink3

    position = -41, 109
    halign = right
    valign = bottom
}

label {
    monitor =
    zindex = 1
    text = cmd[update:2000] c7shell-lock-info media-source
    font_family = $mono
    font_size = 11
    color = $ink4

    position = -41, 88
    halign = right
    valign = bottom
}

# STATUS -- network, battery, and how many notifications are waiting. The count
# comes from the shell over its IPC socket, because hyprlock cannot speak D-Bus:
# the count only, never the contents, which is the design's rule for a locked
# screen. Any field with nothing to say drops out rather than reading zero.
label {
    monitor =
    zindex = 1
    text = cmd[update:30000] c7shell-lock-info status
    font_family = $mono
    font_size = 13
    color = $ink4

    position = -41, 41
    halign = right
    valign = bottom
}

input-field {
    monitor =
    zindex = 1
    size = 408, 55
    rounding = 17
    outline_thickness = 1

    inner_color = $glass
    # The mockup only ever draws this field focused, because it only exists
    # while you are typing into it.
    outer_color = $focus
    check_color = $success
    fail_color  = $accent
    font_color  = $ink

    font_family = $mono
    placeholder_text =
    fail_text = $PAMFAIL · $ATTEMPTS
    check_text = authenticating...

    # Caps lock is the reason a correct password fails, and the login greeter
    # calls it out for the same reason (its card has a caps-lock line).
    capslock_color = $capslock

    dots_size = 0.28
    dots_spacing = 0.3
    # The two states of the mockup, and the only part of it hyprlock implements
    # for free: empty means gone, a keypress brings it back. 8s of idle is the
    # design's fade-out.
    fade_on_empty = true
    fade_timeout = 8000

    position = 0, 0
    halign = center
    valign = center
}

# WHO -- the mockup's "alex · caps lock off · us". The caps-lock word is not
# available to a label (hyprlock only exposes it as a field colour, which
# capslock_color above already uses), so the line is the two that are.
label {
    monitor =
    zindex = 1
    text = $USER · $LAYOUT
    font_family = $mono
    font_size = 12
    color = $ink2

    position = 0, -48
    halign = center
    valign = center
}
