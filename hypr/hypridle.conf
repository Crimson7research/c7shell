# Minimal idle policy: lock after 5 min, screen off 30s later, on resume undo.
general {
    lock_cmd = pidof hyprlock || c7shell-lock
    before_sleep_cmd = loginctl lock-session
    # Hold the sleep until the session is locked: c7shell-lock can take seconds
    # before hyprlock maps, and resume must never show the desktop. Set here
    # rather than left to "auto", which guesses from lock_cmd's wording.
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
