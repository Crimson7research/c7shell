[package]
name = "tailscale-parity"
version = "0.0.0"
description = "Runs the Tailscale scenarios against a C7 module loaded through QML"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
fake-tailscaled = { path = "../../lib/testing/fake-tailscaled" }
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml"] }
serde_json.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# QGuiApplication lives on the main thread, so each test binary has its own
# main (harness = false) and respawns itself for each check or scenario.
[[test]]
name = "stub_selftest"
harness = false

[[test]]
name = "harness_selftest"
harness = false

[[test]]
name = "scenarios"
harness = false
